name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'src/website/**'

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install tailwindcss at root for CSS resolution
        run: npm install tailwindcss --no-save --ignore-scripts

      - name: Install website dependencies
        run: npm ci
        working-directory: src/website

      - name: Build website
        run: npm run build
        working-directory: src/website

      - name: Check for output changes
        id: diff
        run: git diff --quiet docs/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Deploy to Cloudflare Pages
        if: steps.diff.outputs.changed == 'true'
        run: npx wrangler pages deploy docs --project-name open-routines --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
